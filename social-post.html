<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post — Folio</title>
  <meta name="description" content="Read a Folio Social post from the community." />
  <meta name="robots" content="index, follow" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=30" />
</head>
<body class="social-body">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="Folio home">
        <img src="assets/logo.png" alt="" width="36" height="36" />
        <strong>Fol<span>io</span></strong>
      </a>
      <div class="topbar-actions">
        <label class="currency-picker">
          <span class="visually-hidden">Currency</span>
          <select id="currency-select" aria-label="Display currency"></select>
        </label>
        <a class="btn btn-light" href="social.html">Social</a>
        <a class="btn btn-dark" href="account.html">Account</a>
      </div>
    </div>
  </header>

  <main class="shell social-feed-shell" style="grid-template-columns: minmax(0, 680px)">
    <p class="empty" id="post-missing" hidden>
      Post not found. <a href="social.html">Back to Social</a>
    </p>
    <div id="post-root" hidden></div>
  </main>

  <script src="js/auth.js?v=32"></script>
  <script src="js/seo.js?v=1"></script>
  <script>
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function initials(name) {
      return String(name || "F")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((p) => p[0].toUpperCase())
        .join("") || "F";
    }

    function avatarHtml(image, name) {
      if (image) {
        return `<div class="li-avatar" style="background-image:url('${escapeHtml(image)}')" aria-hidden="true"></div>`;
      }
      return `<div class="li-avatar li-avatar-fallback" aria-hidden="true">${escapeHtml(initials(name))}</div>`;
    }

    const me = FolioAuth.getCurrentUser();
    const id = new URLSearchParams(window.location.search).get("id") || "";
    const posts = FolioAuth.getVisibleSocialPosts();
    const post = posts.find((p) => p.id === id);
    const missing = document.getElementById("post-missing");
    const root = document.getElementById("post-root");

    function render() {
      if (!post) {
        missing.hidden = false;
        root.hidden = true;
        document.title = "Post not found — Folio";
        return;
      }
      missing.hidden = true;
      root.hidden = false;
      document.title = `${(post.body || post.title || "Post").slice(0, 48)} — Folio Social`;

      const following = me && me.id !== post.authorId && FolioAuth.isFollowing(me.id, post.authorId);
      const canDelete = me && (me.role === "admin" || me.id === post.authorId);
      const comments = (post.comments || [])
        .map((c) => {
          const canDel =
            me && (me.role === "admin" || me.id === c.authorId || me.id === post.authorId);
          return `
          <div class="li-comment">
            ${avatarHtml(c.authorImage, c.authorName)}
            <div class="li-comment-bubble">
              <div class="li-comment-head">
                <strong>${escapeHtml(c.authorName)}</strong>
                <span>${escapeHtml(c.authorRole || "")}</span>
                ${canDel ? `<button type="button" class="li-comment-del" data-del-comment="${escapeHtml(c.id)}">Delete</button>` : ""}
              </div>
              <p>${escapeHtml(c.body)}</p>
            </div>
          </div>`;
        })
        .join("");

      root.innerHTML = `
        <a class="course-back" href="social.html">← Social</a>
        <article class="li-card" style="margin-top:12px">
          <header class="li-card-head">
            ${avatarHtml(post.authorImage, post.authorName)}
            <div class="li-card-identity">
              <p class="li-card-name">${escapeHtml(post.authorName || "Folio")}</p>
              <p class="li-card-sub">${escapeHtml(post.authorRole || "Member")} · ${escapeHtml((post.createdAt || "").slice(0, 10))}</p>
            </div>
            ${
              me && me.id !== post.authorId && me.role !== "admin"
                ? `<button class="li-follow ${following ? "is-on" : ""}" type="button" id="follow-author">${following ? "Following" : "+ Follow"}</button>`
                : ""
            }
            ${canDelete ? `<button class="li-more" type="button" id="delete-post">Delete</button>` : ""}
          </header>
          <div class="li-card-body"><p>${escapeHtml(post.body || post.excerpt || "").replaceAll("\n", "<br />")}</p></div>
          ${post.coverImage ? `<div class="li-card-media"><img src="${escapeHtml(post.coverImage)}" alt="" /></div>` : ""}
          <div class="li-card-stats"><span>${post.commentCount || 0} comments</span></div>
          <div class="li-comments is-open">
            ${comments}
            ${
              me
                ? `<form class="li-comment-form" id="comment-form">
                    ${avatarHtml(me.profileImage, me.name)}
                    <input type="text" maxlength="1000" placeholder="Add a comment…" required />
                    <button class="btn btn-leaf" type="submit">Comment</button>
                  </form>`
                : `<p class="hint li-comment-login"><a href="login.html">Sign in</a> to comment</p>`
            }
          </div>
        </article>`;

      const followBtn = document.getElementById("follow-author");
      if (followBtn) {
        followBtn.addEventListener("click", () => {
          FolioAuth.toggleFollow({ followerId: me.id, followingId: post.authorId });
          window.location.reload();
        });
      }
      const delBtn = document.getElementById("delete-post");
      if (delBtn) {
        delBtn.addEventListener("click", () => {
          if (!window.confirm("Delete this post?")) return;
          FolioAuth.deleteSocialPost(post.id, me.id);
          window.location.href = "social.html";
        });
      }
      const form = document.getElementById("comment-form");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const input = form.querySelector("input");
          const result = FolioAuth.addSocialComment({
            postId: post.id,
            authorId: me.id,
            body: input.value,
          });
          if (!result.ok) {
            window.alert(result.error);
            return;
          }
          window.location.reload();
        });
      }
      root.querySelectorAll("[data-del-comment]").forEach((btn) => {
        btn.addEventListener("click", () => {
          FolioAuth.deleteSocialComment({
            postId: post.id,
            commentId: btn.dataset.delComment,
            actorId: me.id,
          });
          window.location.reload();
        });
      });
    }

    FolioAuth.mountCurrencySelect(document.getElementById("currency-select"));
    if (window.FolioSEO) FolioSEO.applySocialPost(post || null);
    render();
  </script>
</body>
</html>
