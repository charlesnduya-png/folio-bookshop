<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social — Folio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=27" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="Folio home">
        <img src="assets/logo.png" alt="" width="36" height="36" />
        <strong>Fol<span>io</span></strong>
      </a>
      <div class="topbar-actions">
        <label class="currency-picker">
          <span class="visually-hidden">Currency</span>
          <select id="currency-select" aria-label="Display currency"></select>
        </label>
        <a class="btn btn-light" href="index.html">Shop</a>
        <a class="btn btn-light" href="courses.html">Courses</a>
        <a class="btn btn-dark" href="account.html">Account</a>
      </div>
    </div>
  </header>

  <main class="shell social-page">
    <header class="social-hero">
      <div class="social-hero-icon" aria-hidden="true">
        <svg viewBox="0 0 120 120" role="presentation">
          <circle cx="60" cy="28" r="14" fill="currentColor" />
          <circle cx="28" cy="78" r="12" fill="currentColor" />
          <circle cx="92" cy="78" r="12" fill="currentColor" />
          <path
            d="M48 38 L34 68 M72 38 L86 68 M40 78 H80"
            fill="none"
            stroke="currentColor"
            stroke-width="6"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <div class="social-hero-copy">
        <p class="school-kicker">Community</p>
        <h1 class="page-title">Social</h1>
        <p class="page-sub">Updates from Folio — reading notes, school news, and marketplace moments.</p>
      </div>
    </header>
    <div id="social-list" class="blog-list social-list"></div>
    <p class="empty" id="social-empty" hidden>No social posts yet.</p>
  </main>

  <script src="js/auth.js?v=25"></script>
  <script>
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderSocialList() {
      const posts = (FolioAuth.getSocialPosts || FolioAuth.getBlogPosts)().filter(
        (p) => p.status === "published"
      );
      const list = document.getElementById("social-list");
      const empty = document.getElementById("social-empty");
      if (!posts.length) {
        list.innerHTML = "";
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      list.innerHTML = posts
        .map(
          (p) => `
        <article class="blog-card social-card">
          ${
            p.coverImage
              ? `<a class="blog-card-cover" href="social-post.html?id=${encodeURIComponent(p.id)}" style="background-image:url('${escapeHtml(p.coverImage)}')" aria-hidden="true"></a>`
              : ""
          }
          <div class="blog-card-body">
            <p class="hint" style="margin:0 0 6px">${escapeHtml((p.createdAt || "").slice(0, 10))} · ${escapeHtml(p.authorName || "Folio")}</p>
            <h2><a href="social-post.html?id=${encodeURIComponent(p.id)}">${escapeHtml(p.title)}</a></h2>
            <p>${escapeHtml(p.excerpt || "")}</p>
            <a class="btn btn-leaf" href="social-post.html?id=${encodeURIComponent(p.id)}">View post</a>
          </div>
        </article>`
        )
        .join("");
    }

    FolioAuth.mountCurrencySelect(document.getElementById("currency-select"));
    renderSocialList();
  </script>
</body>
</html>
