<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social — Folio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=30" />
</head>
<body class="social-body">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="Folio home">
        <img src="assets/logo.png" alt="" width="36" height="36" />
        <strong>Fol<span>io</span></strong>
      </a>
      <div class="topbar-actions">
        <label class="currency-picker">
          <span class="visually-hidden">Currency</span>
          <select id="currency-select" aria-label="Display currency"></select>
        </label>
        <a class="btn btn-light" href="index.html">Shop</a>
        <a class="btn btn-light" href="courses.html">Courses</a>
        <a class="btn btn-dark" href="account.html">Account</a>
      </div>
    </div>
  </header>

  <main class="shell social-feed-shell">
    <aside class="social-side-card" id="social-profile-card">
      <div class="social-side-banner" aria-hidden="true"></div>
      <div class="social-side-avatar-wrap">
        <div class="social-side-avatar" id="side-avatar"></div>
        <label class="social-side-photo-btn" id="side-photo-label" hidden>
          <input id="side-profile-image" type="file" accept="image/*" hidden />
          <span id="side-photo-text">Add photo</span>
        </label>
      </div>
      <h2 id="side-name">Folio Social</h2>
      <p class="hint" id="side-role">Students and tutors share updates</p>
      <p class="form-msg" id="side-photo-msg" hidden></p>
      <p class="social-side-stats" id="side-stats" hidden></p>
      <a class="social-side-link" id="side-account-link" href="account.html#profile" hidden>Manage profile</a>
    </aside>

    <div class="social-feed-main">
      <div class="social-feed-toolbar">
        <div class="social-feed-tabs" role="tablist" aria-label="Feed filter">
          <button type="button" class="is-active" data-feed="all">Everyone</button>
          <button type="button" data-feed="following">Following</button>
        </div>
      </div>

      <section class="li-composer" id="social-composer" hidden>
        <div class="li-composer-top">
          <div class="li-avatar" id="composer-avatar" aria-hidden="true"></div>
          <label class="visually-hidden" for="social-body">Start a post</label>
          <textarea id="social-body" placeholder="Start a post…" rows="2"></textarea>
        </div>
        <div class="li-composer-preview" id="image-preview" hidden>
          <img id="image-preview-img" alt="Selected photo" />
          <button type="button" class="li-remove-image" id="clear-image" aria-label="Remove photo">×</button>
        </div>
        <p class="form-msg" id="social-post-msg"></p>
        <div class="li-composer-actions">
          <label class="li-photo-btn">
            <input id="social-image" type="file" accept="image/*" hidden />
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="m21 16-5.2-5.2a1.5 1.5 0 0 0-2.1 0L7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Photo
          </label>
          <button class="btn btn-leaf" type="button" id="publish-post">Post</button>
        </div>
      </section>

      <p class="social-signin-prompt" id="social-signin" hidden>
        <a href="login.html">Sign in</a> as a student or tutor to post, follow, and comment.
      </p>

      <div id="social-list" class="li-feed"></div>
      <p class="empty" id="social-empty" hidden>No posts yet. Share the first update.</p>
    </div>
  </main>

  <script src="js/auth.js?v=32"></script>
  <script>
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function initials(name) {
      return String(name || "F")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((p) => p[0].toUpperCase())
        .join("") || "F";
    }

    function avatarHtml(image, name, extraClass = "") {
      if (image) {
        return `<div class="li-avatar ${extraClass}" style="background-image:url('${escapeHtml(image)}')" aria-hidden="true"></div>`;
      }
      return `<div class="li-avatar li-avatar-fallback ${extraClass}" aria-hidden="true">${escapeHtml(initials(name))}</div>`;
    }

    function timeLabel(iso) {
      if (!iso) return "";
      const then = new Date(iso).getTime();
      if (!Number.isFinite(then)) return String(iso).slice(0, 10);
      const mins = Math.max(0, Math.round((Date.now() - then) / 60000));
      if (mins < 1) return "now";
      if (mins < 60) return mins + "m";
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + "h";
      const days = Math.round(hrs / 24);
      if (days < 7) return days + "d";
      return String(iso).slice(0, 10);
    }

    let feedMode = "all";
    let selectedFile = null;
    const me = FolioAuth.getCurrentUser();

    function setAvatarEl(el, image, name) {
      if (!el) return;
      if (image) {
        el.style.backgroundImage = `url("${image}")`;
        el.textContent = "";
        el.classList.remove("li-avatar-fallback");
      } else {
        el.style.backgroundImage = "";
        el.textContent = initials(name);
        el.classList.add("li-avatar-fallback");
      }
    }

    function renderSide(current) {
      const person = current || me;
      const nameEl = document.getElementById("side-name");
      const roleEl = document.getElementById("side-role");
      const stats = document.getElementById("side-stats");
      const avatar = document.getElementById("side-avatar");
      const photoLabel = document.getElementById("side-photo-label");
      const accountLink = document.getElementById("side-account-link");
      if (person) {
        nameEl.textContent = person.name;
        roleEl.textContent = FolioAuth.socialRoleLabel(person);
        setAvatarEl(avatar, person.profileImage, person.name);
        photoLabel.hidden = false;
        document.getElementById("side-photo-text").textContent = person.profileImage
          ? "Change photo"
          : "Add photo";
        accountLink.hidden = false;
        const c = FolioAuth.getFollowCounts(person.id);
        stats.hidden = false;
        stats.innerHTML = `<strong>${c.followers}</strong> followers · <strong>${c.following}</strong> following`;
      } else {
        nameEl.textContent = "Folio Social";
        roleEl.textContent = "Students and tutors share updates";
        setAvatarEl(avatar, "", "Folio");
        photoLabel.hidden = true;
        accountLink.hidden = true;
        stats.hidden = true;
      }
    }

    function renderComposer() {
      const composer = document.getElementById("social-composer");
      const signin = document.getElementById("social-signin");
      if (me && FolioAuth.canPostToSocial(me)) {
        composer.hidden = false;
        signin.hidden = true;
        setAvatarEl(document.getElementById("composer-avatar"), me.profileImage, me.name);
      } else {
        composer.hidden = true;
        signin.hidden = false;
      }
    }

    function commentsHtml(post) {
      const comments = post.comments || [];
      const list = comments
        .map((c) => {
          const canDelete =
            me && (me.role === "admin" || me.id === c.authorId || me.id === post.authorId);
          return `
          <div class="li-comment">
            ${avatarHtml(c.authorImage, c.authorName, "li-avatar-sm")}
            <div class="li-comment-bubble">
              <div class="li-comment-head">
                <strong>${escapeHtml(c.authorName)}</strong>
                <span>${escapeHtml(c.authorRole || "")} · ${escapeHtml(timeLabel(c.createdAt))}</span>
                ${canDelete ? `<button type="button" class="li-comment-del" data-del-comment="${escapeHtml(c.id)}" data-post="${escapeHtml(post.id)}" aria-label="Delete comment">Delete</button>` : ""}
              </div>
              <p>${escapeHtml(c.body)}</p>
            </div>
          </div>`;
        })
        .join("");

      const box = me
        ? `<form class="li-comment-form" data-comment-form="${escapeHtml(post.id)}">
            ${avatarHtml(me.profileImage, me.name, "li-avatar-sm")}
            <input type="text" maxlength="1000" placeholder="Add a comment…" required />
            <button class="btn btn-leaf" type="submit">Comment</button>
          </form>`
        : `<p class="hint li-comment-login"><a href="login.html">Sign in</a> to comment</p>`;

      return `<div class="li-comments" data-comments="${escapeHtml(post.id)}">${list}${box}</div>`;
    }

    function renderSocialList() {
      const posts = FolioAuth.getVisibleSocialPosts({
        followingOnly: feedMode === "following",
        viewerId: me ? me.id : null,
      });
      const list = document.getElementById("social-list");
      const empty = document.getElementById("social-empty");
      if (!posts.length) {
        list.innerHTML = "";
        empty.hidden = false;
        empty.textContent =
          feedMode === "following"
            ? "No posts from people you follow yet."
            : "No posts yet. Share the first update.";
        return;
      }
      empty.hidden = true;
      list.innerHTML = posts
        .map((p) => {
          const canDelete = me && (me.role === "admin" || me.id === p.authorId);
          const following =
            me && me.id !== p.authorId && p.authorId
              ? FolioAuth.isFollowing(me.id, p.authorId)
              : false;
          const followBtn =
            me && me.id !== p.authorId && me.role !== "admin"
              ? `<button class="li-follow ${following ? "is-on" : ""}" type="button" data-follow="${escapeHtml(p.authorId)}">${following ? "Following" : "+ Follow"}</button>`
              : "";
          return `
        <article class="li-card" data-post-id="${escapeHtml(p.id)}">
          <header class="li-card-head">
            ${avatarHtml(p.authorImage, p.authorName)}
            <div class="li-card-identity">
              <p class="li-card-name">${escapeHtml(p.authorName || "Folio")}</p>
              <p class="li-card-sub">${escapeHtml(p.authorRole || "Member")} · ${escapeHtml(timeLabel(p.createdAt))}</p>
            </div>
            ${followBtn}
            ${canDelete ? `<button class="li-more" type="button" data-del-post="${escapeHtml(p.id)}" aria-label="Delete post">Delete</button>` : ""}
          </header>
          <div class="li-card-body">
            <p>${escapeHtml(p.body || p.excerpt || p.title || "").replaceAll("\n", "<br />")}</p>
          </div>
          ${p.coverImage ? `<div class="li-card-media"><img src="${escapeHtml(p.coverImage)}" alt="" /></div>` : ""}
          <div class="li-card-stats">
            <span>${Number(p.commentCount || 0)} comment${Number(p.commentCount || 0) === 1 ? "" : "s"}</span>
          </div>
          <div class="li-card-toolbar">
            <button type="button" class="li-tool" data-toggle-comments="${escapeHtml(p.id)}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v6A2.5 2.5 0 0 1 16.5 15H10l-4 3.2V15H7.5A2.5 2.5 0 0 1 5 12.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
              Comment
            </button>
            <a class="li-tool" href="social-post.html?id=${encodeURIComponent(p.id)}">Open</a>
          </div>
          ${commentsHtml(p)}
        </article>`;
        })
        .join("");

      bindFeedEvents(list);
    }

    function bindFeedEvents(list) {
      list.querySelectorAll("[data-follow]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (!me) return (window.location.href = "login.html");
          FolioAuth.toggleFollow({ followerId: me.id, followingId: btn.dataset.follow });
          renderSide();
          renderSocialList();
        });
      });

      list.querySelectorAll("[data-del-post]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (!window.confirm("Delete this post?")) return;
          FolioAuth.deleteSocialPost(btn.dataset.delPost, me.id);
          renderSocialList();
        });
      });

      list.querySelectorAll("[data-toggle-comments]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const card = btn.closest(".li-card");
          const panel = card && card.querySelector(".li-comments");
          if (!panel) return;
          panel.classList.toggle("is-open");
          const input = panel.querySelector("input");
          if (panel.classList.contains("is-open") && input) input.focus();
        });
      });

      list.querySelectorAll("[data-comment-form]").forEach((form) => {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          if (!me) return (window.location.href = "login.html");
          const input = form.querySelector("input");
          const result = FolioAuth.addSocialComment({
            postId: form.dataset.commentForm,
            authorId: me.id,
            body: input.value,
          });
          if (!result.ok) {
            window.alert(result.error);
            return;
          }
          renderSocialList();
          const card = document.querySelector(`[data-post-id="${form.dataset.commentForm}"]`);
          const panel = card && card.querySelector(".li-comments");
          if (panel) panel.classList.add("is-open");
        });
      });

      list.querySelectorAll("[data-del-comment]").forEach((btn) => {
        btn.addEventListener("click", () => {
          FolioAuth.deleteSocialComment({
            postId: btn.dataset.post,
            commentId: btn.dataset.delComment,
            actorId: me.id,
          });
          renderSocialList();
          const card = document.querySelector(`[data-post-id="${btn.dataset.post}"]`);
          const panel = card && card.querySelector(".li-comments");
          if (panel) panel.classList.add("is-open");
        });
      });
    }

    document.querySelectorAll("[data-feed]").forEach((btn) => {
      btn.addEventListener("click", () => {
        feedMode = btn.dataset.feed;
        document.querySelectorAll("[data-feed]").forEach((b) => {
          b.classList.toggle("is-active", b === btn);
        });
        if (feedMode === "following" && !me) {
          window.location.href = "login.html";
          return;
        }
        renderSocialList();
      });
    });

    document.getElementById("social-image").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      selectedFile = file || null;
      const preview = document.getElementById("image-preview");
      const img = document.getElementById("image-preview-img");
      if (!file) {
        preview.hidden = true;
        img.removeAttribute("src");
        return;
      }
      const url = URL.createObjectURL(file);
      img.src = url;
      preview.hidden = false;
    });

    document.getElementById("clear-image").addEventListener("click", () => {
      selectedFile = null;
      document.getElementById("social-image").value = "";
      document.getElementById("image-preview").hidden = true;
      document.getElementById("image-preview-img").removeAttribute("src");
    });

    document.getElementById("publish-post").addEventListener("click", async () => {
      const msg = document.getElementById("social-post-msg");
      if (!me) return (window.location.href = "login.html");
      msg.textContent = "Publishing…";
      msg.classList.remove("ok");
      const result = await FolioAuth.createSocialPostWithImage({
        authorId: me.id,
        authorName: me.name,
        body: document.getElementById("social-body").value,
        file: selectedFile,
      });
      if (!result.ok) {
        msg.textContent = result.error;
        return;
      }
      msg.textContent = "Posted.";
      msg.classList.add("ok");
      document.getElementById("social-body").value = "";
      selectedFile = null;
      document.getElementById("social-image").value = "";
      document.getElementById("image-preview").hidden = true;
      document.getElementById("image-preview-img").removeAttribute("src");
      feedMode = "all";
      document.querySelectorAll("[data-feed]").forEach((b) => {
        b.classList.toggle("is-active", b.dataset.feed === "all");
      });
      renderSocialList();
    });

    document.getElementById("side-profile-image").addEventListener("change", async (e) => {
      const msg = document.getElementById("side-photo-msg");
      if (!me) {
        window.location.href = "login.html";
        return;
      }
      const file = e.target.files && e.target.files[0] ? e.target.files[0] : null;
      msg.hidden = false;
      msg.textContent = "Uploading photo…";
      msg.classList.remove("ok");
      const result = await FolioAuth.saveProfileImage(me.id, file);
      e.target.value = "";
      if (!result.ok) {
        msg.textContent = result.error;
        return;
      }
      Object.assign(me, result.user || FolioAuth.getCurrentUser() || {});
      msg.textContent = "Profile photo updated.";
      msg.classList.add("ok");
      renderSide(me);
      renderComposer();
      renderSocialList();
    });

    FolioAuth.mountCurrencySelect(document.getElementById("currency-select"));
    renderSide();
    renderComposer();
    renderSocialList();
  </script>
</body>
</html>
