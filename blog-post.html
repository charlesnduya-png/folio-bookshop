<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, follow" />
  <title>Redirecting to Social — Folio</title>
  <script>
    const id = new URLSearchParams(window.location.search).get("id") || "";
    window.location.replace(id ? "social-post.html?id=" + encodeURIComponent(id) : "social.html");
  </script>
</head>
<body>
  <p>This post moved to <a href="social.html">Social</a>.</p>
</body>
</html>
