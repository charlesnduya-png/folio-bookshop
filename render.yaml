services:
  - type: web
    name: folio-bookshop
    runtime: static
    repo: https://github.com/charlesnduya-png/folio-bookshop
    branch: main
    buildCommand: ""
    staticPublishPath: .
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html